[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "repoguard-local"
version = "0.1.0"
description = "Local pre-publication repository hygiene checks"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
repoguard = "repoguard.cli:main"
[tool.setuptools.packages.find]
include = ["repoguard*"]
